# SaaS CLOUD: Postgres (one database per client) + API + web (Caddy, HTTPS).
#
#   cp .env.cloud.example .env   # fill every value (see docs/CLOUD_SETUP.md)
#   docker compose up -d --build
#   docker compose exec api python scripts/tenants.py create --slug acme ...
#
# DNS: A record  <BASE_DOMAIN>  and  *.<BASE_DOMAIN>  -> this server's IP.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fa_control
    command: >
      postgres -c max_connections=300 -c shared_buffers=1GB -c effective_cache_size=3GB
               -c work_mem=8MB -c maintenance_work_mem=256MB -c wal_compression=on
               -c log_min_duration_statement=500 -c password_encryption=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d fa_control"]
      interval: 5s
      retries: 20
    # NOT published to the internet. Admin access: ssh tunnel to 127.0.0.1:5432
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: ../../backend
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ROLE: cloud
      APP_ENV: production
      CONTROL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/fa_control
      TENANT_DATABASE_URL_TEMPLATE: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/{db}
      # unused in cloud (each tenant has its own), kept valid for tooling
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/fa_control
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/fa_control
      KIOSK_SERVICE_TOKEN: ""
      MEDIA_ROOT: /data/media
    # ONE worker: edge-box WebSockets live in this process (app/edge_hub.py)
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
              --proxy-headers --forwarded-allow-ips=* --ws-max-size 67108864
    volumes:
      - ./backups:/backups
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
